# Netlify build configuration for Next.js 16.
#
# The Next.js runtime is declared explicitly because zero-config detection did
# not install it for API-triggered production builds on this site. Netlify
# installs the current adapter from npm; do not pin an old version.
#
# APP_ENV must be set per deploy context in Netlify:
#   deploy previews -> preview
#   branch/staging  -> staging
#   production      -> production
# NETLIFY=true alone is not treated as production.
#
# No Netlify site, deploy, DNS record, domain, or production database exists
# yet. This file is configuration only, not evidence of a deployment.

[build]
  # The preflight validates non-secret deployment configuration and fails the
  # build with actionable messages before Next.js starts. It does not connect to
  # the database or call any external provider.
  command = "npm run netlify:preflight && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  NEXT_TELEMETRY_DISABLED = "1"
  # APP_ENV and DATABASE_ENV ("production") plus DATABASE_SSL ("require") are
  # ordinary configuration values, not credentials. They are marked secret on
  # Netlify, so scanning would otherwise flag every occurrence of those common
  # words in the repository. Omit only these three keys; all real secrets
  # remain scanned. The public site URL and the boolean/numeric feature flags
  # below are likewise configuration, not credentials ("true", "false", "1",
  # https://esimprove.com appear throughout the code and build output).
  SECRETS_SCAN_OMIT_KEYS = "APP_ENV,DATABASE_ENV,DATABASE_SSL,SITE_URL,PAYMENTS_LIVE_ENABLED,SUPPLIER_LIVE_ENABLED,EMAIL_LIVE_ENABLED,DEMO_MODE,SEED_DEMO_DATA,STAGING_ACCESS_ENABLED,ANALYTICS_ENABLED,CATALOGUE_SYNC_ENABLED,ADMIN_2FA_REQUIRED,DATABASE_POOL_MAX,ACTIVATION_KEK_ACTIVE_VERSION,NEXT_PUBLIC_ANALYTICS_DISABLED,SUPPLIER_CREDENTIAL_ALLOW_ACTIVATION_KEK_FALLBACK"

[[plugins]]
  package = "@netlify/plugin-nextjs"
