# Netlify build configuration for Next.js 16.
#
# Netlify detects Next.js and installs its OpenNext adapter automatically. Do
# not add @netlify/plugin-nextjs or another Next.js plugin: that would pin an
# outdated adapter and conflict with the supported zero-config integration.
#
# APP_ENV must be set per deploy context in Netlify:
#   deploy previews -> preview
#   branch/staging  -> staging
#   production      -> production
# NETLIFY=true alone is not treated as production.
#
# No Netlify site, deploy, DNS record, domain, or production database exists
# yet. This file is configuration only, not evidence of a deployment.

[build]
  # The preflight validates non-secret deployment configuration and fails the
  # build with actionable messages before Next.js starts. It does not connect to
  # the database or call any external provider.
  command = "npm run netlify:preflight && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  NEXT_TELEMETRY_DISABLED = "1"
  # APP_ENV and DATABASE_ENV ("production") plus DATABASE_SSL ("require") are
  # ordinary configuration values, not credentials. They are marked secret on
  # Netlify, so scanning would otherwise flag every occurrence of those common
  # words in the repository. Omit only these three keys; all real secrets
  # remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "APP_ENV,DATABASE_ENV,DATABASE_SSL"
